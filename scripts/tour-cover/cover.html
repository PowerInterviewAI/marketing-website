<!doctype html>
<!--
  Cover for /media/demos/tour.mp4 (public/media/demos/tour.webp), 1920x1080.
  No headline on purpose: it sits beside the hero's h1, which carries the words, and
  the site header carries the brand. It shows the product instead - the mock report
  behind, a live session in front - and the presenter. her.webp is the right side of
  the ad's original cover (../pia-advertise/2026-11-26/assets/ad-90s/source/cover.html),
  whose portrait source was not kept. Render from the repo root:
    msedge --headless=new --hide-scrollbars --force-device-scale-factor=1       --window-size=1920,1080 --allow-file-access-from-files       --screenshot=cover.png file:///<repo>/scripts/tour-cover/cover.html
  then save it as public/media/demos/tour.webp (quality 85).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px; height: 1080px; overflow: hidden; background: #07070a;
        font-family: Inter, 'Segoe UI', sans-serif; color: #fff;
        -webkit-font-smoothing: antialiased;
      }
      .her { position: absolute; right: 0; top: 0; width: 760px; height: 1080px;
        background: url(her.webp) center / cover; }
      .shade { position: absolute; inset: 0;
        background:
          linear-gradient(90deg, #07070a 0%, #07070a 61%, rgba(7,7,10,.75) 66%, rgba(7,7,10,.3) 71%, rgba(7,7,10,0) 76%),
          linear-gradient(0deg, rgba(7,7,10,.85) 0%, rgba(7,7,10,0) 28%); }
      .glow { position: absolute; left: -160px; top: 420px; width: 1100px; height: 800px;
        border-radius: 50%; background: radial-gradient(closest-side, rgba(255,130,40,.30), transparent);
        filter: blur(30px); }
      .glow2 { position: absolute; left: 520px; top: -260px; width: 900px; height: 700px;
        border-radius: 50%; background: radial-gradient(closest-side, rgba(255,160,60,.14), transparent);
        filter: blur(30px); }
      .win { position: absolute; width: 900px; border-radius: 18px; overflow: hidden;
        border: 1px solid rgba(255,255,255,.14);
        box-shadow: 0 40px 120px rgba(0,0,0,.65), 0 0 0 1px rgba(0,0,0,.4); }
      .win img { display: block; width: 100%; }
      .tag { position: absolute; display: flex; align-items: center; gap: 14px;
        padding: 12px 22px; border-radius: 999px; font-size: 28px; font-weight: 650;
        background: rgba(12,12,16,.94); border: 1px solid rgba(255,255,255,.16); }
      .tag b { color: #ff9f2e; font-size: 22px; letter-spacing: .14em; font-weight: 700; }
      .back { left: 112px; top: 176px; transform: rotate(-2deg); opacity: .9; }
      .front { left: 330px; top: 440px; }
    </style>
  </head>
  <body>
    <div class="her"></div>
    <div class="shade"></div>
    <div class="glow"></div>
    <div class="glow2"></div>
    <div class="win back"><img src="../../public/media/docs/mock/report.png" alt="" /></div>
    <div class="win front"><img src="../../public/media/docs/app/overview.jpg" alt="" /></div>

    <div class="tag" style="left: 118px; top: 92px; transform: rotate(-2deg)"><b>BEFORE</b>Mock interview</div>
    <div class="tag" style="left: 336px; top: 362px"><b>DURING</b>Live help</div>
  </body>
</html>
